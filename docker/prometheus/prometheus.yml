# Prometheus Configuration for Indian Railways AI Platform (TSK-P4-008)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'railway_daphne_asgi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:8000', 'host.docker.internal:8000']
        labels:
          application: 'railway_sih'
          environment: 'production'
          zone: 'Northern_Railway'
          division: 'Delhi'

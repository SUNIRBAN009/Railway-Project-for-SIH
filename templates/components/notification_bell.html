<!-- Real-Time Notification Bell & Live Stream Component (SVC-NOTIF / TSK-P3-013 / TSK-P3-014) -->
<div x-data="notificationCenter()" x-init="init()" class="relative">

    <!-- Bell Trigger Button -->
    <button @click="toggleDropdown()" 
            class="relative p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 text-slate-300 hover:text-white border border-slate-700/80 transition-all focus:outline-none focus:ring-2 focus:ring-amber-500/50"
            :class="{ 'ring-2 ring-rose-500/80 text-rose-400': criticalCount > 0 }"
            title="Operational Notifications Stream">
        <i data-lucide="bell" class="w-4 h-4"></i>
        
        <!-- Live WebSocket Status Pip -->
        <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full border border-slate-900"
              :class="wsConnected ? 'bg-emerald-400' : 'bg-rose-500'"
              :title="wsConnected ? 'WebSocket Live: Connected' : 'WebSocket: Connecting/Offline'">
        </span>

        <!-- Unread Badge -->
        <template x-if="unreadCount > 0">
            <span class="absolute -top-1.5 -right-1.5 px-1.5 py-0.2 min-w-[18px] h-[18px] text-[10px] font-extrabold rounded-full flex items-center justify-center text-white shadow-md"
                  :class="criticalCount > 0 ? 'bg-rose-600 animate-pulse ring-2 ring-rose-400' : 'bg-amber-500 text-slate-950'"
                  x-text="unreadCount > 99 ? '99+' : unreadCount">
            </span>
        </template>
    </button>

    <!-- Notification Dropdown Panel -->
    <div x-show="isOpen" 
         @click.away="isOpen = false"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0 translate-y-1 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-1 scale-95"
         class="absolute right-0 mt-2 w-80 sm:w-96 bg-slate-900/95 backdrop-blur-xl border border-slate-700 rounded-2xl shadow-2xl shadow-black/80 z-50 overflow-hidden text-xs"
         style="display: none;">
        
        <!-- Header -->
        <div class="px-4 py-3 bg-slate-800/80 border-b border-slate-700/80 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="font-bold text-white text-sm">Notifications</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                      :class="unreadCount > 0 ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-slate-700 text-slate-400'"
                      x-text="unreadCount + ' unread'">
                </span>
                <span class="w-1.5 h-1.5 rounded-full" :class="wsConnected ? 'bg-emerald-400 animate-ping' : 'bg-slate-500'"></span>
            </div>

            <div class="flex items-center gap-1.5">
                <button @click="toggleSound()" 
                        class="p-1 rounded text-slate-400 hover:text-white transition"
                        :title="soundEnabled ? 'Mute Alert Chimes' : 'Enable Alert Chimes'">
                    <i :data-lucide="soundEnabled ? 'volume-2' : 'volume-x'" class="w-3.5 h-3.5"></i>
                </button>
                <template x-if="unreadCount > 0">
                    <button @click="markAllRead()" 
                            class="text-[11px] text-amber-400 hover:text-amber-300 font-medium px-2 py-0.5 rounded hover:bg-slate-700/50 transition">
                        Mark All Read
                    </button>
                </template>
            </div>
        </div>

        <!-- Notification List Items -->
        <div class="max-h-80 overflow-y-auto divide-y divide-slate-800">
            <template x-if="notifications.length === 0">
                <div class="p-8 text-center text-slate-400">
                    <i data-lucide="bell-off" class="w-8 h-8 mx-auto text-slate-600 mb-2"></i>
                    <p class="font-medium text-slate-300">All clear on Section Control</p>
                    <p class="text-[11px] text-slate-500 mt-1">No active alarms or alerts for your persona</p>
                </div>
            </template>

            <template x-for="item in notifications" :key="item.id">
                <div class="p-3 transition-colors flex items-start gap-3 group"
                     :class="item.is_read ? 'bg-slate-900/40 hover:bg-slate-800/40 opacity-75' : 'bg-slate-800/60 hover:bg-slate-800'">
                    
                    <!-- Priority Indicator Icon -->
                    <div class="shrink-0 mt-0.5">
                        <template x-if="item.priority === 'CRITICAL_ALARM'">
                            <span class="w-6 h-6 rounded-lg bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center justify-center font-bold">
                                <i data-lucide="alert-triangle" class="w-3.5 h-3.5 animate-bounce"></i>
                            </span>
                        </template>
                        <template x-if="item.priority === 'URGENT_ACTION'">
                            <span class="w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center font-bold">
                                <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                            </span>
                        </template>
                        <template x-if="item.priority === 'ROUTINE_INFO' || !item.priority">
                            <span class="w-6 h-6 rounded-lg bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 flex items-center justify-center font-bold">
                                <i data-lucide="info" class="w-3.5 h-3.5"></i>
                            </span>
                        </template>
                    </div>

                    <!-- Content -->
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-1 mb-0.5">
                            <h4 class="font-semibold text-white text-xs truncate" x-text="item.title"></h4>
                            <span class="text-[10px] text-slate-400 shrink-0 font-mono" x-text="formatTime(item.created_at)"></span>
                        </div>
                        <p class="text-slate-300 text-[11px] line-clamp-2 leading-relaxed" x-text="item.message_body || item.message"></p>

                        <!-- Footer Tags -->
                        <div class="mt-1.5 flex items-center justify-between text-[10px]">
                            <span class="px-1.5 py-0.2 rounded font-mono text-[9px] uppercase font-bold"
                                  :class="{
                                      'bg-rose-500/20 text-rose-400 border border-rose-500/30': item.priority === 'CRITICAL_ALARM',
                                      'bg-amber-500/20 text-amber-400 border border-amber-500/30': item.priority === 'URGENT_ACTION',
                                      'bg-slate-800 text-slate-400': item.priority === 'ROUTINE_INFO'
                                  }"
                                  x-text="item.category_display || item.category || 'INFO'">
                            </span>

                            <template x-if="!item.is_read">
                                <button @click="markRead(item)" 
                                        class="text-amber-400 hover:text-amber-300 font-medium hover:underline">
                                    Mark Read
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Footer / Live Trigger Simulation -->
        <div class="p-2.5 bg-slate-950/80 border-t border-slate-800 flex items-center justify-between">
            <div class="text-[10px] font-mono text-slate-500 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full" :class="wsConnected ? 'bg-emerald-400' : 'bg-rose-500'"></span>
                <span x-text="wsConnected ? 'Daphne ASGI Online' : 'Reconnecting...'"></span>
            </div>
            <div class="flex items-center gap-1">
                <button @click="triggerTestAlert('ROUTINE_INFO')" 
                        class="px-2 py-1 rounded text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 transition font-medium">
                    + Test Chime
                </button>
                <button @click="triggerTestAlert('CRITICAL_ALARM')" 
                        class="px-2 py-1 rounded text-[10px] bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-700/50 transition font-bold">
                    + Alarm Modal
                </button>
            </div>
        </div>
    </div>

    <!-- Critical Alert Pop-Up Modal (TSK-P3-013) -->
    <template x-if="criticalModal">
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100">
            <div class="w-full max-w-lg bg-slate-900 border-2 border-rose-600 rounded-2xl shadow-2xl shadow-rose-950/80 overflow-hidden">
                <!-- Header with flashing beacon -->
                <div class="bg-rose-950/80 border-b border-rose-700 px-6 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="w-9 h-9 rounded-xl bg-rose-600/30 border border-rose-500 flex items-center justify-center text-rose-400 animate-pulse">
                            <i data-lucide="alert-octagon" class="w-5 h-5"></i>
                        </span>
                        <div>
                            <span class="text-xs font-mono font-bold text-rose-400 uppercase tracking-wider block">Critical Rail Safety Alarm</span>
                            <h3 class="text-base font-bold text-white leading-tight" x-text="criticalModal.title"></h3>
                        </div>
                    </div>
                    <span class="px-2 py-1 rounded bg-rose-600 text-white font-mono text-[10px] font-extrabold uppercase animate-pulse">
                        IMMEDIATE
                    </span>
                </div>

                <!-- Body -->
                <div class="p-6 space-y-4">
                    <p class="text-sm text-slate-200 leading-relaxed font-medium" x-text="criticalModal.message_body || criticalModal.message"></p>
                    
                    <div class="grid grid-cols-2 gap-3 p-3 rounded-xl bg-slate-950/80 border border-slate-800 text-xs">
                        <div>
                            <span class="text-slate-500 text-[10px] uppercase font-mono block">Category</span>
                            <strong class="text-amber-400" x-text="criticalModal.category_display || criticalModal.category || 'SAFETY_CONFLICT'"></strong>
                        </div>
                        <div>
                            <span class="text-slate-500 text-[10px] uppercase font-mono block">Target Reference</span>
                            <strong class="text-cyan-400 font-mono" x-text="(criticalModal.target_entity_type || 'CORRIDOR') + ' ' + (criticalModal.target_entity_id || 'NDLS-CNB')"></strong>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="px-6 py-4 bg-slate-950/90 border-t border-slate-800 flex items-center justify-end gap-3">
                    <button @click="dismissCriticalModal()" 
                            class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg shadow-rose-600/30 transition flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        Acknowledge & Dismiss Alarm
                    </button>
                </div>
            </div>
        </div>
    </template>

</div>

<script>
/**
 * Alpine.js component logic for Real-Time Notifications & WebSocket stream.
 */
function notificationCenter() {
    return {
        isOpen: false,
        unreadCount: 0,
        criticalCount: 0,
        notifications: [],
        wsConnected: false,
        soundEnabled: true,
        criticalModal: null,
        socket: null,
        audioCtx: null,

        init() {
            this.fetchNotifications();
            this.fetchUnreadCount();
            this.connectWebSocket();
        },

        toggleDropdown() {
            this.isOpen = !this.isOpen;
            if (this.isOpen && window.lucide) {
                this.$nextTick(() => window.lucide.createIcons());
            }
        },

        toggleSound() {
            this.soundEnabled = !this.soundEnabled;
            if (window.lucide) {
                this.$nextTick(() => window.lucide.createIcons());
            }
        },

        getAudioContext() {
            if (!this.audioCtx) {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) {
                    this.audioCtx = new AudioCtxClass();
                }
            }
            if (this.audioCtx && this.audioCtx.state === 'suspended') {
                this.audioCtx.resume();
            }
            return this.audioCtx;
        },

        playChime(isCritical = false) {
            if (!this.soundEnabled) return;
            try {
                const ctx = this.getAudioContext();
                if (!ctx) return;

                const now = ctx.currentTime;
                if (isCritical) {
                    // Urgent alarm pulse: 3 rising staccato tones (800Hz -> 1000Hz -> 1200Hz)
                    [800, 1000, 1200].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.12);

                        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.1);

                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 0.11);
                    });
                } else {
                    // Soft operational chime: pleasant 2-tone melodic chime (587Hz -> 880Hz)
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(587.33, now); // D5
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880.00, now + 0.12); // A5

                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(ctx.destination);

                    osc1.start(now);
                    osc1.stop(now + 0.12);
                    osc2.start(now + 0.12);
                    osc2.stop(now + 0.45);
                }
            } catch (e) {
                console.warn("Web Audio API chime prevented by browser policy:", e);
            }
        },

        connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/notifications/`;

            try {
                this.socket = new WebSocket(wsUrl);

                this.socket.onopen = () => {
                    this.wsConnected = true;
                    console.log("[SVC-NOTIF] Connected to Daphne WebSocket stream:", wsUrl);
                };

                this.socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'notification') {
                            this.handleIncomingNotification(data.payload);
                        }
                    } catch (err) {
                        console.error("[SVC-NOTIF] Error parsing WS payload:", err);
                    }
                };

                this.socket.onclose = () => {
                    this.wsConnected = false;
                    // Auto reconnect in 4 seconds
                    setTimeout(() => this.connectWebSocket(), 4000);
                };

                this.socket.onerror = (err) => {
                    this.wsConnected = false;
                };
            } catch (err) {
                this.wsConnected = false;
                setTimeout(() => this.connectWebSocket(), 5000);
            }
        },

        handleIncomingNotification(payload) {
            this.unreadCount++;
            const isCritical = payload.priority === 'CRITICAL_ALARM';
            if (isCritical) {
                this.criticalCount++;
                this.criticalModal = payload;
            }

            // Prepend to notifications list
            this.notifications.unshift({
                id: payload.id,
                title: payload.title,
                message_body: payload.message,
                priority: payload.priority,
                category: payload.category,
                target_entity_type: payload.target_entity_type,
                target_entity_id: payload.target_entity_id,
                created_at: payload.created_at || new Date().toISOString(),
                is_read: false,
            });

            // Play audio chime
            this.playChime(isCritical);

            // Recreate icons
            if (window.lucide) {
                this.$nextTick(() => window.lucide.createIcons());
            }

            // Emit custom event for other page components (Gantt, Map, Dashboard)
            document.dispatchEvent(new CustomEvent('railway:notification', { detail: payload }));
            if (payload.corridor_code) {
                document.dispatchEvent(new CustomEvent('railway:corridor-invalidate', { detail: payload }));
            }
        },

        fetchNotifications() {
            fetch('/api/v1/notifications/?limit=20')
                .then(res => res.json())
                .then(res => {
                    if ((res.success || res.status === 'success') && res.data) {
                        this.notifications = res.data;
                        if (window.lucide) {
                            this.$nextTick(() => window.lucide.createIcons());
                        }
                    }
                })
                .catch(() => {});
        },

        fetchUnreadCount() {
            fetch('/api/v1/notifications/unread-count/')
                .then(res => res.json())
                .then(res => {
                    if ((res.success || res.status === 'success') && res.data) {
                        this.unreadCount = res.data.unread_count || 0;
                        this.criticalCount = res.data.critical_count || 0;
                    }
                })
                .catch(() => {});
        },

        markRead(item) {
            fetch(`/api/v1/notifications/${item.id}/mark-read/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': this.getCSRFToken(),
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(res => {
                if (res.success || res.status === 'success') {
                    item.is_read = true;
                    this.unreadCount = Math.max(0, this.unreadCount - 1);
                    if (item.priority === 'CRITICAL_ALARM' || item.priority === 'CRITICAL_EMERGENCY') {
                        this.criticalCount = Math.max(0, this.criticalCount - 1);
                    }
                }
            })
            .catch(() => {});
        },

        markAllRead() {
            fetch('/api/v1/notifications/mark-all-read/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': this.getCSRFToken(),
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(res => {
                if (res.success || res.status === 'success') {
                    this.notifications.forEach(n => n.is_read = true);
                    this.unreadCount = 0;
                    this.criticalCount = 0;
                }
            })
            .catch(() => {});
        },

        dismissCriticalModal() {
            if (this.criticalModal) {
                const id = this.criticalModal.id;
                this.criticalModal = null;
                if (id) {
                    const item = this.notifications.find(n => n.id === id);
                    if (item) this.markRead(item);
                }
            }
        },

        triggerTestAlert(priority) {
            const isCritical = (priority === 'CRITICAL_ALARM' || priority === 'CRITICAL_EMERGENCY');
            fetch('/api/v1/notifications/test-send/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': this.getCSRFToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    priority: priority,
                    category: isCritical ? 'SAFETY_CONFLICT_ALARM' : 'GENERAL_INFO',
                    title: isCritical ? 'EMERGENCY: Track Defect Signal Alarm' : 'Routine Corridor Update',
                    message: isCritical 
                        ? 'Critical Track Circuit Flaw detected at KM 142/6 (NDLS-CNB). Automatic Stop Signal Engaged.' 
                        : 'Routine Track Tamping Maintenance Block Scheduled for 02:00 IST.',
                    send_sms: false
                })
            })
            .then(res => res.json())
            .then(res => {
                if ((res.success || res.status === 'success') && res.data) {
                    this.handleIncomingNotification({
                        id: res.data.id,
                        title: res.data.title,
                        message: res.data.message_body,
                        priority: res.data.priority,
                        category: res.data.category,
                        target_entity_type: res.data.target_entity_type,
                        target_entity_id: res.data.target_entity_id,
                        created_at: res.data.created_at
                    });
                }
            })
            .catch(err => console.error("Test send error:", err));
        },

        formatTime(isoStr) {
            if (!isoStr) return '';
            try {
                const date = new Date(isoStr);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return '';
            }
        },

        getCSRFToken() {
            const cookieValue = document.cookie
                .split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
            return cookieValue || '{{ csrf_token }}';
        }
    };
}
</script>
